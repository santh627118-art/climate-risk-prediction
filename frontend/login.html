<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Climate Risk</title>

<link rel="stylesheet" href="css/style.css">

<style>

.auth-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#06111f;
    padding:40px;
}

.auth-card{
    width:420px;
    background:linear-gradient(145deg,#102438,#091725);
    border:1px solid rgba(255,255,255,.08);
    border-radius:12px;
    padding:35px;
}

.auth-card h1{
    margin-bottom:8px;
}

.auth-card p{
    color:#8999a8;
    font-size:13px;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-size:12px;
}

.form-group input{
    width:100%;
    padding:12px;
    background:#071522;
    border:1px solid rgba(255,255,255,.08);
    border-radius:6px;
    color:white;
}

.auth-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:6px;
    background:#42e27b;
    font-weight:700;
    cursor:pointer;
    margin-top:10px;
}

.auth-link{
    text-align:center;
    margin-top:20px;
    font-size:12px;
}

.auth-link a{
    color:#42e27b;
}

</style>
</head>

<body>

<div class="auth-page">

<div class="auth-card">

<h1>Welcome Back</h1>

<p>Sign in to access the Climate Risk platform.</p>

<form>

<div class="form-group">
<label>Email</label>
<input type="email" placeholder="Enter email">
</div>

<div class="form-group">
<label>Password</label>
<input type="password" placeholder="Enter password">
</div>

<button class="auth-btn">
Login
</button>

</form>

<div class="auth-link">
Don't have an account?
<a href="register.html">Register</a>
</div>

</div>

</div>

</body>
</html>
